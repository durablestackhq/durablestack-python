name: Publish PyPI

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "src/**"
      - "README.md"
      - ".github/workflows/publish-pypi.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc-dev

      - name: Install package and dev dependencies
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Quality gates
        run: python -m ruff check . && python -m mypy && python -m pytest -q

      - name: Build artifacts
        run: python -m build && python -m twine check dist/*

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          python -c "import pathlib, tomllib; data = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); print('version=' + data['project']['version'])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check version changed from previous main commit
        id: version_check
        shell: pwsh
        run: |
          $baseRef = "${{ github.event.before }}"
          if ([string]::IsNullOrWhiteSpace($baseRef) -or $baseRef -eq "0000000000000000000000000000000000000000") {
            "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "No valid base ref available (first push or manual run); publish remains allowed."
            exit 0
          }
          $output = python scripts/check_version_bump.py --base-ref $baseRef --pyproject pyproject.toml
          $output
          if ($LASTEXITCODE -ne 0) {
            throw "Version check script failed"
          }
          if ($output -match "version_changed=true") {
            "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Check if version exists on PyPI
        id: pypi_check
        if: steps.version_check.outputs.changed == 'true'
        shell: pwsh
        run: |
          $url = "https://pypi.org/pypi/durablestack/${{ steps.version.outputs.version }}/json"
          $status = 0
          try {
            $response = Invoke-WebRequest -Uri $url -Method Get -ErrorAction Stop
            $status = [int]$response.StatusCode
          } catch {
            if ($_.Exception.Response) {
              $status = [int]$_.Exception.Response.StatusCode
            } else {
              throw
            }
          }
          if ($status -eq 200) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "Version already exists on PyPI; skipping publish." 
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "Version does not exist on PyPI; publishing."
          }

      - name: Publish to PyPI
        if: steps.version_check.outputs.changed == 'true' && steps.pypi_check.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish summary
        shell: pwsh
        run: |
          if ('${{ steps.version_check.outputs.changed }}' -ne 'true') {
            "No publish: version did not change in pyproject.toml." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } elseif ('${{ steps.pypi_check.outputs.exists }}' -eq 'true') {
            "No publish: durablestack ${{ steps.version.outputs.version }} already exists." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "Published durablestack ${{ steps.version.outputs.version }} to PyPI." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
